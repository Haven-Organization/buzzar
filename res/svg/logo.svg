<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="64" fill="#7000FF"/>
  <defs>
    <clipPath id="body-inside">
      <ellipse cx="68" cy="74" rx="28" ry="20"/>
    </clipPath>
  </defs>
  <g transform="translate(5 2)">
    <!-- wings: swept-back outlined ovals -->
    <ellipse cx="58" cy="37" rx="17" ry="10" transform="rotate(-62 58 37)" stroke="white" stroke-width="8.5"/>
    <ellipse cx="81" cy="40" rx="17" ry="10" transform="rotate(-26 81 40)" stroke="white" stroke-width="8.5"/>
    <g transform="rotate(-14 68 74)">
      <!-- purple gap where the body overlaps the wings -->
      <ellipse cx="68" cy="74" rx="28" ry="20" fill="#7000FF" stroke="#7000FF" stroke-width="18"/>
      <g clip-path="url(#body-inside)">
        <rect x="59" y="48" width="8.5" height="54" fill="white"/>
        <rect x="76" y="48" width="8.5" height="54" fill="white"/>
      </g>
      <ellipse cx="68" cy="74" rx="28" ry="20" stroke="white" stroke-width="10.5"/>
      <path d="M100.5 74 L109 74" stroke="white" stroke-width="7.5" stroke-linecap="round"/>
    </g>
    <!-- head with purple gap -->
    <circle cx="32" cy="84" r="15" fill="#7000FF"/>
    <circle cx="32" cy="84" r="10.5" fill="white"/>
    <!-- antennae -->
    <path d="M27 75 C25 69 21 65 17 64" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M35 74 C35 68 33 63 30 59" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
