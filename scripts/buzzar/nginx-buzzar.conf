# Local Buzzar build (scripts/buzzar/deploy-local.sh) at http://localhost:8090.
# Install: sudo cp scripts/buzzar/nginx-buzzar.conf /etc/nginx/sites-enabled/buzzar && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 127.0.0.1:8090;
    server_name localhost;
    root /usr/share/nginx/html/buzzar;
    index index.html;

    # The engine's worker threads share memory (SharedArrayBuffer), which browsers only allow on
    # cross-origin isolated pages.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # The service worker must never be served stale, or new builds won't take over.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # The docs (VitePress, built into dist/docs) use extensionless URLs.
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
    }

    location /logviewer {
        try_files $uri $uri/ /logviewer/index.html;
    }

    # Buzzar's landing page moved to the Haven website.
    location ~ ^/landing/?$ {
        return 301 https://haven.software/buzzar/;
    }

    # Client-side routes (/world/…, /viewer, …) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
