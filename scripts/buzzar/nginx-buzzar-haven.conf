# Public Buzzar build at https://buzzar.haven.software (scripts/buzzar/deploy-haven-app.sh uploads it).
# Lives on the VPS as /etc/nginx/sites-available/buzzar.haven.software; certbot added the TLS lines there.
server {
	server_name buzzar.haven.software;
	access_log /var/log/nginx/buzzar.haven.software-access.log combined;
	include /etc/nginx/snippets/block-bots.conf;

	root /var/www/buzzar.haven.software/site;
	index index.html;

	# The engine's worker threads share memory (SharedArrayBuffer), which browsers only allow on
	# cross-origin isolated pages.
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Embedder-Policy "require-corp" always;

	# The service worker must never be served stale, or new builds won't take over.
	# The page itself must always be revalidated: without this, browsers and the desktop app cache it
	# heuristically and keep starting an old build after a deploy. (Every client-side route is served
	# as /index.html, so this covers them too.)
	location = /index.html {
		add_header Cache-Control "no-cache" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Embedder-Policy "require-corp" always;
	}

	location = /sw.js {
		add_header Cache-Control "no-cache" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Embedder-Policy "require-corp" always;
	}

	# Hashed build assets never change.
	location /assets/ {
		expires 30d;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Embedder-Policy "require-corp" always;
	}

	# The docs (VitePress, built into dist/docs) use extensionless URLs.
	location /docs/ {
		try_files $uri $uri.html $uri/ =404;
	}

	location /logviewer {
		try_files $uri $uri/ /logviewer/index.html;
	}

	# Buzzar's landing page moved to the Haven website.
	location ~ ^/landing/?$ {
		return 301 https://haven.software/buzzar/;
	}

	# Client-side routes (/world/…, /login, …) all load the app.
	location / {
		try_files $uri $uri/ /index.html;
	}

	listen 80;
	listen [::]:80;
}
