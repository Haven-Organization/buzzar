# Buzzar in a container (see ../Dockerfile). The same rules as scripts/buzzar/nginx-buzzar.conf, on port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The engine's worker threads share memory (SharedArrayBuffer), which browsers only allow on
    # cross-origin isolated pages.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # The page and the service worker are always revalidated, so a new build takes over.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # The docs (VitePress, built into /docs) use extensionless URLs.
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
    }

    location /logviewer {
        try_files $uri $uri/ /logviewer/index.html;
    }

    # Client-side routes (/world/…, /viewer, …) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
